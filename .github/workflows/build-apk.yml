name: Build Kindred APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ -d "$SDK_DIR" ] && [ ! -w "$SDK_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
          fi
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --update || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Prepare signing keystores, Firebase config, and env properties
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            rm -f my-upload-key.jks
            keytool -importkeystore \
              -srckeystore debug.keystore -srcstorepass android -srcalias androiddebugkey -srckeypass android \
              -destkeystore my-upload-key.jks -deststorepass android -destalias upload -destkeypass android -noprompt
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/candidate-google-services.json
            if python3 -m json.tool /tmp/candidate-google-services.json >/dev/null 2>&1; then
              cp /tmp/candidate-google-services.json app/google-services.json
            else
              echo "::warning::GOOGLE_SERVICES_JSON secret is not valid JSON; keeping repository app/google-services.json if present."
            fi
            rm -f /tmp/candidate-google-services.json
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json is missing. Using CI fallback for R.string.default_web_client_id."
            mkdir -p app/src/debug/res/values app/src/release/res/values
            for target_dir in app/src/debug/res/values app/src/release/res/values; do
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<resources>' \
                '    <string name="default_web_client_id" translatable="false"></string>' \
                '</resources>' > "$target_dir/ci_google_services_fallback.xml"
            done
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release & Debug APKs
        run: >
          gradle :app:assembleRelease :app:assembleDebug
          --no-daemon --no-configuration-cache
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=2
          --console=plain --stacktrace
          -PKINDRED_GITHUB_REPO="${{ github.repository }}"
          -PKINDRED_BUILD_NUMBER="${{ github.run_number }}"

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindred-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk kindred-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk kindred-debug.apk
          gh release create "$TAG" kindred-release.apk kindred-debug.apk \
            --latest \
            --title "Kindred APK #${{ github.run_number }}" \
            --notes "Consistently signed release APK (kindred-release.apk) and debug APK for Kindred Build #${{ github.run_number }}."